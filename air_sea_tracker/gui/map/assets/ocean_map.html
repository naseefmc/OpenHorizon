<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; background: #0B1120; cursor: crosshair; }
  .selected-pin {
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .leaflet-popup-content { font: 12px/1.4 -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // CARTO Voyager: closest free/keyless basemap to Google Maps' look
  // (cream land, blue water, orange/white labeled road hierarchy) —
  // actual Google Maps tiles can't be legally embedded outside Google's
  // own SDK/attribution requirements.
  const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 20,
  }).addTo(map);
  const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19,
  });
  let darkLayerActive = false;

  function toggleDarkLayer() {
    if (darkLayerActive) { map.removeLayer(darkLayer); map.addLayer(lightLayer); }
    else { map.removeLayer(lightLayer); map.addLayer(darkLayer); }
    darkLayerActive = !darkLayerActive;
  }

  function zoomIn() { map.zoomIn(); }
  function zoomOut() { map.zoomOut(); }

  let bridge = null;
  const wmsLayers = {};      // layerId -> L.tileLayer.wms, currently on the map
  const wmsConfigs = {};     // layerId -> last cfg used to build the layer (for opacity/etc changes)
  let selectedPin = null;

  // --- Ocean/environment WMS overlays (SDR §4, §11) ---
  function setLayer(id, cfg, visible) {
    if (!cfg) { removeLayer(id); return; }
    wmsConfigs[id] = cfg;
    if (!visible) { removeLayer(id); return; }
    if (wmsLayers[id]) { map.removeLayer(wmsLayers[id]); }
    const params = Object.assign({
      layers: cfg.layers, format: 'image/png', transparent: true, version: '1.3.0',
    }, cfg.extra_params || {});
    const layer = L.tileLayer.wms(cfg.url, Object.assign(params, {
      crs: L.CRS.EPSG4326,
      opacity: cfg.opacity != null ? cfg.opacity : 0.7,
      attribution: cfg.attribution || '',
    }));
    layer.addTo(map);
    wmsLayers[id] = layer;
  }

  function setLayerVisible(id, visible) {
    const cfg = wmsConfigs[id];
    if (!cfg) return;
    setLayer(id, cfg, visible);
  }

  function removeLayer(id) {
    if (wmsLayers[id]) { map.removeLayer(wmsLayers[id]); delete wmsLayers[id]; }
  }

  // --- Click-to-select (SDR §5) ---
  // A hand-drawn SVG teardrop instead of an emoji glyph: emoji fonts draw
  // their pin's visual tip at a different pixel than Leaflet's iconAnchor
  // expects (varies by OS/font), which made the pin visibly drift from the
  // actual clicked point. This SVG's tip is at exactly (12, 32), matched
  // 1:1 to iconAnchor, so the pin always lands on the real coordinate.
  const PIN_SVG = '<svg width="24" height="32" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#FBBF24"/>'
    + '<circle cx="12" cy="12" r="4.5" fill="#0B1120"/>'
    + '</svg>';

  function setSelectedMarker(lat, lon) {
    if (selectedPin) map.removeLayer(selectedPin);
    selectedPin = L.marker([lat, lon], {
      icon: L.divIcon({ className: 'selected-pin', html: PIN_SVG, iconSize: [24, 32], iconAnchor: [12, 32] }),
    }).addTo(map);
  }

  map.on('click', (e) => {
    setSelectedMarker(e.latlng.lat, e.latlng.lng);
    if (bridge) bridge.on_map_clicked(e.latlng.lat, e.latlng.lng);
  });

  window.setLayer = setLayer;
  window.setLayerVisible = setLayerVisible;
  window.setSelectedMarker = setSelectedMarker;
  window.zoomIn = zoomIn;
  window.zoomOut = zoomOut;
  window.toggleDarkLayer = toggleDarkLayer;

  if (window.qt && window.qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      bridge = channel.objects.bridge;
    });
  }
</script>
</body>
</html>
