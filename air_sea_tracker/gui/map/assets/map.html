<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; background: #0B1120; }
  .target-icon {
    font-size: 18px;
    line-height: 18px;
    text-align: center;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    transform-origin: center center;
  }
  .target-icon.aircraft { color: #3B82F6; }
  .target-icon.vessel { color: #22D3EE; }
  .target-icon.selected { color: #FBBF24; filter: drop-shadow(0 0 4px #FBBF24); }
  .leaflet-popup-content { font: 12px/1.4 -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
  // Same CARTO Voyager basemap as the Ocean & Environment tab's map, for
  // visual consistency between the two — closest free/keyless equivalent
  // to Google Maps' look (cream land, blue water, labeled road hierarchy).
  const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 20,
  }).addTo(map);
  const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19,
  });
  let darkLayerActive = false;

  function toggleDarkLayer() {
    if (darkLayerActive) {
      map.removeLayer(darkLayer);
      map.addLayer(lightLayer);
    } else {
      map.removeLayer(lightLayer);
      map.addLayer(darkLayer);
    }
    darkLayerActive = !darkLayerActive;
  }

  function zoomIn() { map.zoomIn(); }
  function zoomOut() { map.zoomOut(); }

  let observerMarker = null;
  let radiusCircle = null;
  const markers = {};   // target_id -> L.marker
  let selectedId = null;
  let bridge = null;
  let trackLine = null;

  // SDR §7/§24: Global Mode clusters at wide zoom and progressively
  // separates on zoom-in; harmless (auto-degrades to single markers) for
  // Nearby Mode's much smaller target count, so always routed through it.
  const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 60, disableClusteringAtZoom: 12 }).addTo(map);

  function arrowIcon(category, heading, selected) {
    const cls = 'target-icon ' + category + (selected ? ' selected' : '');
    const glyph = category === 'aircraft' ? '&#9992;' : '&#9973;';
    const rot = heading != null ? `transform: rotate(${heading}deg);` : '';
    return L.divIcon({
      className: '',
      html: `<div class="${cls}" style="${rot}">${glyph}</div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
    });
  }

  function setObserver(lat, lon) {
    if (observerMarker) map.removeLayer(observerMarker);
    observerMarker = L.circleMarker([lat, lon], {
      radius: 6, color: '#3B82F6', fillColor: '#3B82F6', fillOpacity: 1,
    }).addTo(map);
    map.setView([lat, lon], map.getZoom() < 5 ? 8 : map.getZoom());
    if (radiusCircle) radiusCircle.setLatLng([lat, lon]);
  }

  function setRadiusKm(lat, lon, radiusKm) {
    const meters = radiusKm * 1000;
    if (radiusCircle) {
      radiusCircle.setLatLng([lat, lon]);
      radiusCircle.setRadius(meters);
    } else {
      radiusCircle = L.circle([lat, lon], {
        radius: meters, color: '#3B82F6', weight: 1, fillOpacity: 0.04,
      }).addTo(map);
    }
  }

  function upsertMarker(id, lat, lon, heading, category, label) {
    const icon = arrowIcon(category, heading, id === selectedId);
    if (markers[id]) {
      markers[id].setLatLng([lat, lon]);
      markers[id].setIcon(icon);
      markers[id].bindTooltip(label);
    } else {
      const m = L.marker([lat, lon], { icon });
      m.bindTooltip(label, { direction: 'top' });
      m.on('click', () => { if (bridge) bridge.on_marker_clicked(id); });
      markers[id] = m;
      clusterGroup.addLayer(m);
    }
  }

  function removeMarker(id) {
    if (markers[id]) {
      clusterGroup.removeLayer(markers[id]);
      delete markers[id];
    }
  }

  function syncMarkers(list) {
    const seen = new Set();
    for (const t of list) {
      seen.add(t.id);
      upsertMarker(t.id, t.lat, t.lon, t.heading, t.category, t.label);
    }
    for (const id of Object.keys(markers)) {
      if (!seen.has(id)) removeMarker(id);
    }
  }

  function drawTrack(points) {
    // points: [[lat, lon], ...] oldest first (SDR §8, §16 "historical track lines")
    if (trackLine) { map.removeLayer(trackLine); trackLine = null; }
    if (!points || points.length === 0) return;
    if (points.length === 1) {
      // A single point can't form a polyline/bounds — still recenter the
      // map on it instead of silently leaving the view wherever it was
      // (previously: nothing visibly happened for a 1-point track).
      map.setView(points[0], 12);
      trackLine = L.circleMarker(points[0], { radius: 6, color: '#FBBF24', fillColor: '#FBBF24', fillOpacity: 1 }).addTo(map);
      return;
    }
    trackLine = L.polyline(points, { color: '#FBBF24', weight: 2, opacity: 0.8 }).addTo(map);
    map.fitBounds(trackLine.getBounds(), { padding: [40, 40] });
  }

  function clearTrack() {
    if (trackLine) { map.removeLayer(trackLine); trackLine = null; }
  }

  function highlightMarker(id) {
    selectedId = id;
    for (const [mid, m] of Object.entries(markers)) {
      const el = m.getElement();
      if (!el) continue;
      const child = el.querySelector('.target-icon');
      if (child) child.classList.toggle('selected', mid === id);
    }
  }

  // --- Worldwide species search overlay (independent of observer/radius) ---
  const SPECIES_COLORS = {
    whale: '#1D4ED8', dolphin: '#0891B2', 'shark/ray': '#DC2626',
    seabird: '#059669', 'crab/shrimp': '#EA580C',
  };
  let speciesLayer = null;

  function plotSpeciesPoints(points) {
    clearSpeciesPoints();
    speciesLayer = L.markerClusterGroup({ maxClusterRadius: 40 });
    for (const p of points) {
      const color = SPECIES_COLORS[p.classification] || '#7C3AED';
      const marker = L.circleMarker([p.lat, p.lon], {
        radius: 5, color: '#0B1120', weight: 1, fillColor: color, fillOpacity: 0.85,
      });
      const dateLine = p.observed_on ? `<br>Observed: ${p.observed_on}` : '';
      marker.bindPopup(`<b>${p.scientific_name}</b>${p.classification ? ' (' + p.classification + ')' : ''}${dateLine}`);
      speciesLayer.addLayer(marker);
    }
    speciesLayer.addTo(map);
    if (points.length) {
      const bounds = L.latLngBounds(points.map(p => [p.lat, p.lon]));
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 6 });
    }
  }

  function clearSpeciesPoints() {
    if (speciesLayer) { map.removeLayer(speciesLayer); speciesLayer = null; }
  }

  window.setObserver = setObserver;
  window.setRadiusKm = setRadiusKm;
  window.syncMarkers = syncMarkers;
  window.highlightMarker = highlightMarker;
  window.drawTrack = drawTrack;
  window.clearTrack = clearTrack;
  window.plotSpeciesPoints = plotSpeciesPoints;
  window.clearSpeciesPoints = clearSpeciesPoints;
  window.zoomIn = zoomIn;
  window.zoomOut = zoomOut;
  window.toggleDarkLayer = toggleDarkLayer;

  if (window.qt && window.qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      bridge = channel.objects.bridge;
    });
  }
</script>
</body>
</html>
